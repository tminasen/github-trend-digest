name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build, Test, and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        working-directory: ./
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: ./
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: ./
        run: cargo test --verbose

  scripts_and_workflows:
    name: Scripts and Workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run bats tests
        run: npx --yes bats@1.13.0 tests/bats

      - name: Run shellcheck
        run: npx --yes shellcheck@4.1.0 scripts/*.sh tests/bats/stubs/gcloud tests/bats/stubs/docker

      - name: Run actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color

      - name: Run hadolint
        run: docker run --rm -i -v "$PWD/.hadolint.yaml":/.config/hadolint.yaml hadolint/hadolint:v2.15.1 < Dockerfile
